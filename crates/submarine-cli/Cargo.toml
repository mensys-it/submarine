[package]
name = "submarine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# dependencies: the daemon libraries, used directly by `up` and through IPC otherwise
[dependencies]
serde_json = "1"
submarine-config = { version = "0.1.0", path = "../submarine-config" }
submarine-ipc = { version = "0.1.0", path = "../submarine-ipc" }
submarine-net = { version = "0.1.0", path = "../submarine-net" }
submarine-tunnel = { version = "0.1.0", path = "../submarine-tunnel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
