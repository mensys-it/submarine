[package]
name = "submarine-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
boringtun = { version = "0.7", default-features = false }
ip_network = "0.4"
ipnet.workspace = true
ip_network_table = "0.2"
socket2 = { version = "0.6", features = ["all"] }
submarine-config = { version = "0.1.0", path = "../submarine-config" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
tun-rs = { version = "2.8", features = ["async_tokio"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis"] }
