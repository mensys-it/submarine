[workspace]
resolver = "3"
# crates of the service and its libraries, plus the backend of the desktop app
members = ["crates/*", "apps/desktop/src-tauri"]
# the desktop app is NOT built by default because on Linux it needs WebKitGTK:
# build it explicitly with `-p submarine-desktop`
default-members = ["crates/*"]

# metadata shared by every crate of the workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

# dependencies whose version and features are defined once for the whole workspace
[workspace.dependencies]
base64 = "0.23"
ipnet = { version = "2.12", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
